<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140">
  <defs>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .name {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 58px;
        letter-spacing: 10px;
      }
      .tag {
        font-family: 'Consolas', 'SF Mono', Menlo, monospace;
        font-weight: 500;
        font-size: 15px;
        letter-spacing: 4px;
      }
    </style>
  </defs>

  <rect width="1000" height="140" fill="#0D1117"/>

  <!-- Soft RGB ghost layer: cyan -->
  <text class="name" x="500" y="80" text-anchor="middle" fill="#00E5FF" opacity="0.35">
    MOHAMMED BILAL NADEEM
    <animateTransform attributeName="transform" type="translate"
      dur="6s" repeatCount="indefinite"
      values="0 0; -2 0; 1 0; 0 0; 0 0"
      keyTimes="0; 0.3; 0.5; 0.7; 1"/>
  </text>

  <!-- Soft RGB ghost layer: purple -->
  <text class="name" x="500" y="80" text-anchor="middle" fill="#A78BFA" opacity="0.35">
    MOHAMMED BILAL NADEEM
    <animateTransform attributeName="transform" type="translate"
      dur="6s" repeatCount="indefinite"
      values="0 0; 2 0; -1 0; 0 0; 0 0"
      keyTimes="0; 0.3; 0.5; 0.7; 1"/>
  </text>

  <!-- Primary name -->
  <text class="name" x="500" y="80" text-anchor="middle" fill="#F0F6FC" filter="url(#softGlow)">
    MOHAMMED BILAL NADEEM
  </text>

  <!-- Subtle scan sweep -->
  <rect x="0" y="0" width="1000" height="8" fill="url(#sweep)">
    <animate attributeName="y" dur="9s" repeatCount="indefinite"
      values="-10; 150; 150" keyTimes="0; 0.7; 1"/>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
      values="0; 0.9; 0" keyTimes="0; 0.35; 0.7"/>
  </rect>

  <!-- Subtitle line -->
  <text class="tag" x="500" y="115" text-anchor="middle" fill="#8B949E">
    AI / ML ENGINEER
  </text>
</svg>